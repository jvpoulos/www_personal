news:

- date: "Jul 2026"
  text: '<a href="https://doi.org/10.1080/01621459.2023.2183129" target="_blank">"Adversarial Machine Learning: Bayesian Perspectives"</a> (<i>JASA</i>, 2023), with David Ríos Insua, Roi Naveiro, and Víctor Gallego, received the <a href="https://www.seio.es/premios-seio-fbbva/" target="_blank">Premio SEIO–Fundación BBVA 2026</a> for Best Contribution from Statistics and Operations Research to Data Science.'


- date: "Jan 2026"
  text: '<a href="https://www.nature.com/articles/s41586-025-09962-4" target="_blank">Humanity''s Last Exam</a>, a benchmark of expert-level academic questions to assess AI capabilities, is published in <i>Nature</i>.'


- date: "Jan 2026"
  text: '<a href="https://arxiv.org/abs/2601.11868" target="_blank">Terminal-Bench: Benchmarking Agents on Hard, Realistic Tasks in Command Line Interfaces</a> is accepted at ICLR 2026.'


