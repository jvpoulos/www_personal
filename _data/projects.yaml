# Research projects shown in the Projects section, newest first.
# Buttons appear for any of: website, code, slides, paper, blog.
projects:

- title: "Transformer Models for Diabetes Treatment Failure"
  time: "2023–2024"
  description: 'Interpretable transformer neural networks trained on over 10 million clinical events from Mass General Brigham electronic health records, combining static and temporal patient features to predict diabetes treatment failure (HbA1c &ge; 7% within 12 months). Compares tabular transformers with a GPT-style autoregressive transformer on patient event streams.'
  code: "https://github.com/jvpoulos/diabetes_pred"
  slides: "/assets/slides/diabetes_pred_slides_2024.pdf"

- title: "Doubly Robust Causal Inference with Multi-Valued Treatment Regimes and RNNs"
  description: 'Extends the longitudinal targeted minimum loss-based estimator (LTMLE) to multi-valued treatment regimes by modeling treatment assignment with a multinomial model, and integrates recurrent neural networks as an alternative to sequential g-computation. In simulations, the multinomial model improves efficiency over a series of binomial regressions, and LTMLE with RNNs reduces average bias relative to ensemble machine learning. Motivated by the safety of antipsychotic treatment regimes for adults with serious mental illnesses.'
  code: "https://github.com/jvpoulos/multi-ltmle"
